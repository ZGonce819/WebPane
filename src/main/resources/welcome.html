<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPane</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            color: #1d1d1f;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            max-width: 560px;
            width: 90%;
        }

        /* Logo / Brand */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
        }

        .brand-icon svg {
            width: 100%;
            height: 100%;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1d1d1f;
        }

        .brand-tagline {
            font-size: 14px;
            color: #86868b;
            text-align: center;
            line-height: 1.6;
        }

        /* Search Box */
        .search-wrapper {
            width: 100%;
            position: relative;
        }

        .search-box {
            width: 100%;
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            overflow: hidden;
        }

        .search-box:focus-within {
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.15);
            border-color: rgba(0, 122, 255, 0.3);
        }

        .search-engine-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: none;
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .search-engine-btn:hover {
            background: #f0f0f5;
        }

        .search-engine-btn svg {
            width: 22px;
            height: 22px;
        }

        .search-input {
            flex: 1;
            height: 48px;
            border: none;
            outline: none;
            font-size: 15px;
            color: #1d1d1f;
            background: transparent;
            padding: 0 16px 0 0;
        }

        .search-input::placeholder {
            color: #aeaeb2;
        }

        .search-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: none;
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .search-submit:hover {
            background: #f0f0f5;
        }

        .search-submit svg {
            width: 20px;
            height: 20px;
            fill: #007aff;
        }

        /* Engine Toggle Dropdown */
        .engine-dropdown {
            display: none;
            position: absolute;
            top: 52px;
            left: 0;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(0, 0, 0, 0.06);
            z-index: 10;
            overflow: hidden;
            min-width: 170px;
        }

        .engine-dropdown.show {
            display: block;
        }

        .engine-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 14px;
            color: #1d1d1f;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .engine-option:hover {
            background: #f0f0f5;
        }

        .engine-option.active {
            background: #e8f0fe;
            color: #007aff;
        }

        .engine-option svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* Tips */
        .tips {
            font-size: 12px;
            color: #aeaeb2;
            text-align: center;
            line-height: 1.8;
        }

        .tips a {
            color: #007aff;
            text-decoration: none;
        }

        .tips a:hover {
            text-decoration: underline;
        }

        .kbd-hint {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        kbd {
            display: inline-block;
            padding: 2px 6px;
            font-size: 11px;
            font-family: inherit;
            color: #86868b;
            background: #e8e8ed;
            border-radius: 4px;
            border: 1px solid #d2d2d7;
        }
    </style>
</head>

                icon: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M11.97 7.569a.92.92 0 00-.805.863c-.013.195-.01.209.43 1.347 1 2.59 1.242 3.214 1.283 3.302.099.213.237.413.41.592.134.138.222.212.37.311.26.176.39.224 1.405.527.989.295 1.529.49 1.994.723.603.302 1.024.644 1.29 1.051.191.292.36.815.434 1.342.029.206.029.661 0 .847a2.491 2.491 0 01-.376 1.026c-.1.151-.065.126.081-.058.415-.52.838-1.408 1.054-2.213a6.728 6.728 0 00.102-3.012 6.626 6.626 0 00-3.291-4.53 104.157 104.157 0 00-1.322-.698l-.254-.133a737.941 737.941 0 01-1.575-.827c-.548-.29-.78-.406-.846-.426a1.376 1.376 0 00-.29-.045l-.093.01z" fill="url(#bing-grad-0)"/><path d="M13.164 17.24a4.385 4.385 0 00-.202.125 511.45 511.45 0 00-1.795 1.115 163.087 163.087 0 01-.989.614l-.463.288a99.198 99.198 0 01-1.502.941c-.326.2-.704.334-1.09.387-.18.024-.52.024-.7 0a2.807 2.807 0 01-1.318-.538 3.665 3.665 0 01-.543-.545 2.837 2.837 0 01-.506-1.141 2.161 2.161 0 00-.041-.182c-.008-.008.006.138.032.33.027.199.085.487.147.733.482 1.907 1.85 3.457 3.705 4.195a6.31 6.31 0 001.658.412c.22.025.844.035 1.074.017 1.054-.08 1.972-.393 2.913-.992a325.28 325.28 0 01.937-.596l.384-.244.684-.435.234-.149.009-.005.025-.017.013-.007.172-.11.597-.38c.76-.481.987-.65 1.34-.998.148-.146.37-.394.381-.425.002-.007.042-.068.088-.136a2.49 2.49 0 00.373-1.023 4.181 4.181 0 000-.847 4.336 4.336 0 00-.318-1.137c-.224-.472-.7-.9-1.383-1.245a2.972 2.972 0 00-.406-.181c-.01 0-.646.392-1.413.87a7089.171 7089.171 0 00-1.658 1.031l-.439.274z" fill="url(#bing-grad-1)" fill-rule="nonzero"/><path d="M4.003 14.946l.004 3.33.042.193c.134.604.366 1.04.77 1.445a2.701 2.701 0 001.955.814c.536 0 1-.135 1.479-.43l.703-.435.556-.346V8.003c0-2.306-.004-3.675-.012-3.782a2.734 2.734 0 00-.797-1.765c-.145-.144-.268-.24-.637-.496A1780.102 1780.102 0 015.762.362C5.406.115 5.38.098 5.271.059a.943.943 0 00-1.254.696C4.003.818 4 1.659 4 6.223v5.394H4l.003 3.329z" fill="url(#bing-grad-2)" fill-rule="nonzero"/><defs><radialGradient cx="9         };

        let currentEngine = 'bing';
        const searchInput = document.getElementById('searchInput');
        const engineToggle = document.getElementById('engineToggle');
        const engineDropdown = document.getElementById('engineDropdown');
        const searchBtn = document.getElementById('searchBtn');

        function setEngine(engine) {
            currentEngine = engine;
            const eng = engines[engine];
            searchInput.placeholder = eng.placeholder;
            engineToggle.innerHTML = eng.icon;
            document.querySelectorAll('.engine-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.engine === engine);
            });
            engineDropdown.classList.remove('show');
            searchInput.focus();
        }

        function doSearch() {
            const q = searchInput.value.trim();
            if (!q) return;
            if (/^(https?:\/\/|www\.)/i.test(q) || /^[\w.-]+\.\w{2,}(\/\S*)?$/i.test(q)) {
                const url = q.startsWith('http') ? q : 'https://' + q;
                window.location.href = url;
            } else {
                window.location.href = engines[currentEngine].url(q);
            }
        }

        engineToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            engineDropdown.classList.toggle('show');
        });

        document.querySelectorAll('.engine-option').forEach(opt => {
            opt.addEventListener('click', () => setEngine(opt.dataset.engine));
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        searchBtn.addEventListener('click', doSearch);

        document.addEventListener('click', () => {
            engineDropdown.classList.remove('show');
        });

        engineDropdown.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
</body>
</html>
