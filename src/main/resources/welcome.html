<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPane</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            color: #1d1d1f;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            max-width: 560px;
            width: 90%;
        }

        /* Logo / Brand */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
        }

        .brand-icon svg {
            width: 100%;
            height: 100%;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1d1d1f;
        }

        .brand-tagline {
            font-size: 14px;
            color: #86868b;
            text-align: center;
            line-height: 1.6;
        }

        /* Search Box */
        .search-wrapper {
            width: 100%;
            position: relative;
        }

        .search-box {
            width: 100%;
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            overflow: hidden;
        }

        .search-box:focus-within {
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.15);
            border-color: rgba(0, 122, 255, 0.3);
        }

        .search-engine-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: none;
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .search-engine-btn:hover {
            background: #f0f0f5;
        }

        .search-engine-btn svg {
            width: 22px;
            height: 22px;
        }

        .search-input {
            flex: 1;
            height: 48px;
            border: none;
            outline: none;
            font-size: 15px;
            color: #1d1d1f;
            background: transparent;
            padding: 0 16px 0 0;
        }

        .search-input::placeholder {
            color: #aeaeb2;
        }

        .search-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: none;
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .search-submit:hover {
            background: #f0f0f5;
        }

        .search-submit svg {
            width: 20px;
            height: 20px;
            fill: #007aff;
        }

        /* Engine Toggle Dropdown */
        .engine-dropdown {
            display: none;
            position: absolute;
            top: 52px;
            left: 0;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(0, 0, 0, 0.06);
            z-index: 10;
            overflow: hidden;
            min-width: 170px;
        }

        .engine-dropdown.show {
            display: block;
        }

        .engine-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 14px;
            color: #1d1d1f;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .engine-option:hover {
            background: #f0f0f5;
        }

        .engine-option.active {
            background: #e8f0fe;
            color: #007aff;
        }

        .engine-option svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* Home Button */
        .home-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            background: #ffffff;
            color: #1d1d1f;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .home-btn:hover {
            background: #f0f0f5;
            border-color: #007aff;
            color: #007aff;
        }

        .home-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Tips */
        .tips {
            font-size: 12px;
            color: #aeaeb2;
            text-align: center;
            line-height: 1.8;
        }

        .tips a {
            color: #007aff;
            text-decoration: none;
        }

        .tips a:hover {
            text-decoration: underline;
        }

        .kbd-hint {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        kbd {
            display: inline-block;
            padding: 2px 6px;
            font-size: 11px;
            font-family: inherit;
            color: #86868b;
            background: #e8e8ed;
            border-radius: 4px;
            border: 1px solid #d2d2d7;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Brand -->
        <div class="brand">
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
                    <rect x="2" y="4" width="36" height="32" rx="4" fill="#6B7280"/>
                    <rect x="2" y="4" width="36" height="10" rx="4" fill="#4B5563"/>
                    <rect x="2" y="10" width="36" height="4" fill="#4B5563"/>
                    <circle cx="8" cy="9" r="1.8" fill="#F87171"/>
                    <circle cx="12" cy="9" r="1.8" fill="#FBBF24"/>
                    <circle cx="16" cy="9" r="1.8" fill="#34D399"/>
                    <rect x="21" y="6.5" width="15" height="5" rx="2.5" fill="#9CA3AF" opacity="0.5"/>
                    <rect x="4" y="16" width="32" height="18" rx="2" fill="#F9FAFB"/>
                    <circle cx="20" cy="25" r="6" fill="none" stroke="#60A5FA" stroke-width="1.3"/>
                    <line x1="14" y1="25" x2="26" y2="25" stroke="#60A5FA" stroke-width="1.3"/>
                    <ellipse cx="20" cy="25" rx="3" ry="6" fill="none" stroke="#60A5FA" stroke-width="1.3"/>
                </svg>
            </div>
            <div class="brand-name">WebPane</div>
            <div class="brand-tagline">
                Your integrated browser in IDE<br>
                IDE 内置浏览器，触手可及
            </div>
        </div>

        <!-- Search -->
        <div class="search-wrapper">
            <div class="search-box">
                <button class="search-engine-btn" id="engineToggle" title="Switch search engine">
                    <svg id="engineIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 2.04-1.67 3.55-3.6 4.06v3.37c3.53-.33 6.63-2.39 7.64-5.83h.6z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                </button>
                <input type="text" class="search-input" id="searchInput"
                       placeholder="Search with Google / 使用 Google 搜索" autofocus>
                <button class="search-submit" id="searchBtn" title="Search">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </button>
            </div>
            <div class="engine-dropdown" id="engineDropdown">
                <button class="engine-option active" data-engine="google">
                    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 2.04-1.67 3.55-3.6 4.06v3.37c3.53-.33 6.63-2.39 7.64-5.83h.6z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Google
                </button>
                <button class="engine-option" data-engine="baidu">
                    <svg viewBox="0 0 24 24"><path fill="#2932E1" d="M12.5 2C7.26 2 3 6.26 3 11.5c0 2.12.7 4.08 1.88 5.66L3 22l5.06-1.78A9.44 9.44 0 0012.5 21c5.24 0 9.5-4.26 9.5-9.5S17.74 2 12.5 2zm0 17c-1.72 0-3.32-.52-4.66-1.42l-.34-.22-3.54 1.24 1.12-3.38-.24-.36A7.44 7.44 0 014 11.5C4 7.36 7.86 4 12.5 4S21 7.36 21 11.5 17.14 19 12.5 19z"/><path fill="#2932E1" d="M16.3 13.1c-.28-.14-1.66-.82-1.92-.92-.26-.09-.44-.14-.63.14-.19.28-.72.92-.88 1.11-.16.19-.33.21-.61.07-.28-.14-1.19-.44-2.27-1.4-.84-.75-1.4-1.67-1.57-1.95-.16-.28-.02-.43.12-.57.13-.13.28-.33.42-.5.14-.16.19-.28.28-.47.09-.19.05-.35-.02-.49-.07-.14-.63-1.52-.86-2.08-.23-.55-.46-.47-.63-.48l-.54-.01c-.19 0-.49.07-.75.35-.26.28-.99.97-.99 2.36s1.01 2.74 1.15 2.92c.14.19 1.99 3.04 4.82 4.26.67.29 1.2.46 1.61.59.68.22 1.3.19 1.79.11.55-.08 1.66-.68 1.89-1.33.23-.66.23-1.22.16-1.33-.07-.12-.26-.19-.54-.33z"/></svg>
                    Baidu / 百度
                </button>
                <button class="engine-option" data-engine="bing">
                    <svg viewBox="0 0 24 24"><path fill="#00809D" d="M3.1 3.5L9.3 2v13.2L3.1 11.5V3.5zm0 0L9.3 5.2V2L3.1 3.5zM9.3 15.2L15.1 12V5.2L9.3 8.4v6.8zm5.8-3.2L21 9.2v11.3l-5.9-3.5V12z"/></svg>
                    Bing
                </button>
            </div>
        </div>

        <!-- Home Button -->
        <button class="home-btn" id="homeBtn" title="Back to home page">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            回到主页 / Home
        </button>

        <!-- Tips -->
        <div class="tips">
            Enter a URL or search keyword in the box above, then press <kbd>Enter</kbd><br>
            在上方输入网址或关键词，按 <kbd>Enter</kbd> 开始浏览
            <div class="kbd-hint" style="margin-top: 12px; font-size: 11px; color: #c7c7cc;">
                WebPane v1.0.0 &middot; JCEF Browser
            </div>
        </div>
    </div>

    <script>
        const engines = {
            google: {
                name: 'Google',
                url: q => 'https://www.google.com/search?q=' + encodeURIComponent(q),
                placeholder: 'Search with Google / 使用 Google 搜索',
                icon: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 2.04-1.67 3.55-3.6 4.06v3.37c3.53-.33 6.63-2.39 7.64-5.83h.6z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>'
            },
            baidu: {
                name: 'Baidu',
                url: q => 'https://www.baidu.com/s?wd=' + encodeURIComponent(q),
                placeholder: 'Search with Baidu / 使用百度搜索',
                icon: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#2932E1" d="M12.5 2C7.26 2 3 6.26 3 11.5c0 2.12.7 4.08 1.88 5.66L3 22l5.06-1.78A9.44 9.44 0 0012.5 21c5.24 0 9.5-4.26 9.5-9.5S17.74 2 12.5 2zm0 17c-1.72 0-3.32-.52-4.66-1.42l-.34-.22-3.54 1.24 1.12-3.38-.24-.36A7.44 7.44 0 014 11.5C4 7.36 7.86 4 12.5 4S21 7.36 21 11.5 17.14 19 12.5 19z"/><path fill="#2932E1" d="M16.3 13.1c-.28-.14-1.66-.82-1.92-.92-.26-.09-.44-.14-.63.14-.19.28-.72.92-.88 1.11-.16.19-.33.21-.61.07-.28-.14-1.19-.44-2.27-1.4-.84-.75-1.4-1.67-1.57-1.95-.16-.28-.02-.43.12-.57.13-.13.28-.33.42-.5.14-.16.19-.28.28-.47.09-.19.05-.35-.02-.49-.07-.14-.63-1.52-.86-2.08-.23-.55-.46-.47-.63-.48l-.54-.01c-.19 0-.49.07-.75.35-.26.28-.99.97-.99 2.36s1.01 2.74 1.15 2.92c.14.19 1.99 3.04 4.82 4.26.67.29 1.2.46 1.61.59.68.22 1.3.19 1.79.11.55-.08 1.66-.68 1.89-1.33.23-.66.23-1.22.16-1.33-.07-.12-.26-.19-.54-.33z"/></svg>'
            },
            bing: {
                name: 'Bing',
                url: q => 'https://www.bing.com/search?q=' + encodeURIComponent(q),
                placeholder: 'Search with Bing / 使用 Bing 搜索',
                icon: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#00809D" d="M3.1 3.5L9.3 2v13.2L3.1 11.5V3.5zm0 0L9.3 5.2V2L3.1 3.5zM9.3 15.2L15.1 12V5.2L9.3 8.4v6.8zm5.8-3.2L21 9.2v11.3l-5.9-3.5V12z"/></svg>'
            }
        };

        let currentEngine = 'google';
        const searchInput = document.getElementById('searchInput');
        const engineToggle = document.getElementById('engineToggle');
        const engineDropdown = document.getElementById('engineDropdown');
        const searchBtn = document.getElementById('searchBtn');
        const homeBtn = document.getElementById('homeBtn');

        function setEngine(engine) {
            currentEngine = engine;
            const eng = engines[engine];
            searchInput.placeholder = eng.placeholder;
            // Fix: use innerHTML on the button instead of outerHTML on the icon element,
            // so the #engineToggle button reference stays valid across switches.
            engineToggle.innerHTML = eng.icon;
            document.querySelectorAll('.engine-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.engine === engine);
            });
            engineDropdown.classList.remove('show');
            searchInput.focus();
        }

        function doSearch() {
            const q = searchInput.value.trim();
            if (!q) return;
            if (/^(https?:\/\/|www\.)/i.test(q) || /^[\w.-]+\.\w{2,}(\/\S*)?$/i.test(q)) {
                const url = q.startsWith('http') ? q : 'https://' + q;
                window.location.href = url;
            } else {
                window.location.href = engines[currentEngine].url(q);
            }
        }

        engineToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            engineDropdown.classList.toggle('show');
        });

        document.querySelectorAll('.engine-option').forEach(opt => {
            opt.addEventListener('click', () => setEngine(opt.dataset.engine));
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        searchBtn.addEventListener('click', doSearch);

        // Home button: reload the welcome page
        homeBtn.addEventListener('click', () => {
            window.location.reload();
        });

        document.addEventListener('click', () => {
            engineDropdown.classList.remove('show');
        });

        engineDropdown.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
</body>
</html>
