<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Browser window frame -->
  <rect x="2" y="4" width="36" height="32" rx="4" fill="#6B7280"/>
  <!-- Header bar -->
  <rect x="2" y="4" width="36" height="10" rx="4" fill="#4B5563"/>
  <rect x="2" y="10" width="36" height="4" fill="#4B5563"/>
  <!-- Window control dots -->
  <circle cx="8" cy="9" r="1.8" fill="#F87171"/>
  <circle cx="12" cy="9" r="1.8" fill="#FBBF24"/>
  <circle cx="16" cy="9" r="1.8" fill="#34D399"/>
  <!-- Address bar -->
  <rect x="21" y="6.5" width="15" height="5" rx="2.5" fill="#9CA3AF" opacity="0.5"/>
  <!-- Content area -->
  <rect x="4" y="16" width="32" height="18" rx="2" fill="#F9FAFB"/>
  <!-- Globe -->
  <circle cx="20" cy="25" r="6" fill="none" stroke="#60A5FA" stroke-width="1.3"/>
  <line x1="14" y1="25" x2="26" y2="25" stroke="#60A5FA" stroke-width="1.3"/>
  <ellipse cx="20" cy="25" rx="3" ry="6" fill="none" stroke="#60A5FA" stroke-width="1.3"/>
</svg>
