<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <mask id="m">
      <rect width="40" height="40" fill="white"/>
      <rect x="3" y="14" width="34" height="20" rx="2" fill="black"/>
    </mask>
  </defs>
  <!-- Browser window frame (content area cut out via mask) -->
  <g mask="url(#m)">
    <rect x="1" y="2" width="38" height="34" rx="4" fill="#D1D5DB"/>
    <rect x="1" y="2" width="38" height="11" rx="4" fill="#9CA3AF"/>
    <rect x="1" y="8" width="38" height="5" fill="#9CA3AF"/>
    <!-- Window control dots -->
    <circle cx="7" cy="7.5" r="2" fill="#E5E7EB" opacity="0.5"/>
    <circle cx="12" cy="7.5" r="2" fill="#E5E7EB" opacity="0.5"/>
    <circle cx="17" cy="7.5" r="2" fill="#E5E7EB" opacity="0.5"/>
    <!-- Address bar -->
    <rect x="21" y="5" width="16" height="5" rx="2.5" fill="#E5E7EB" opacity="0.5"/>
  </g>
  <!-- Globe -->
  <circle cx="20" cy="24" r="7" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
  <line x1="13" y1="24" x2="27" y2="24" stroke="#E5E7EB" stroke-width="1.5"/>
  <ellipse cx="20" cy="24" rx="3.5" ry="7" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
</svg>
