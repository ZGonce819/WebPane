<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <mask id="m">
      <rect width="40" height="40" fill="white"/>
      <rect x="4" y="16" width="32" height="18" rx="2" fill="black"/>
    </mask>
  </defs>
  <!-- Browser window frame (content area cut out via mask) -->
  <g mask="url(#m)">
    <rect x="2" y="4" width="36" height="32" rx="4" fill="#6B7280"/>
    <rect x="2" y="4" width="36" height="10" rx="4" fill="#4B5563"/>
    <rect x="2" y="10" width="36" height="4" fill="#4B5563"/>
    <!-- Window control dots -->
    <circle cx="8" cy="9" r="1.8" fill="#9CA3AF"/>
    <circle cx="12" cy="9" r="1.8" fill="#9CA3AF"/>
    <circle cx="16" cy="9" r="1.8" fill="#9CA3AF"/>
    <!-- Address bar -->
    <rect x="21" y="6.5" width="15" height="5" rx="2.5" fill="#9CA3AF" opacity="0.5"/>
  </g>
  <!-- Globe -->
  <circle cx="20" cy="25" r="6" fill="none" stroke="#9CA3AF" stroke-width="1.3"/>
  <line x1="14" y1="25" x2="26" y2="25" stroke="#9CA3AF" stroke-width="1.3"/>
  <ellipse cx="20" cy="25" rx="3" ry="6" fill="none" stroke="#9CA3AF" stroke-width="1.3"/>
</svg>
